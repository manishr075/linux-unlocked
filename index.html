<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LINUX UNLOCKED — The Gateway to Linux. Discover, experience, and understand Linux in your browser. No installation required." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"

    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
  </head>
  <body style="background-color: #0a0c12; color: #f1f5f9; margin: 0; min-height: 100vh;">
    <div id="root"></div>
    <script>
      (function() {
        try {
          const redirect = sessionStorage.getItem("redirectPath");
          if (redirect && redirect.startsWith("/") && redirect !== "/" && redirect !== window.location.pathname) {
            sessionStorage.removeItem("redirectPath");
            window.history.replaceState(null, "", redirect);
          }
        } catch (e) {
          // Ignore storage restrictions in private/sandboxed modes
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
